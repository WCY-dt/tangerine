############# Basic Settings #############
# site title
title: Tangerine's Blog
# site description, used in meta tags
description: A blog using Tangerine theme, powered by Jekyll.
# site keywords, used in meta tags
keywords:
  - blog
  - jekyll
  - tangerine
  - theme
  - jekyll-theme
# author information
author:
  name: Tangerine
  link: https://github.com/WCY-dt/tangerine
  email: mail@ch3nyang.top
# site language
lang: en
# site timezone
timezone: Asia/Shanghai
# display powered by jekyll in footer
powered_by: false
# the subpath of your site
baseurl:
# the base hostname & protocol for your site
url: https://tangerine.ch3nyang.top
# the path to the github repo of your site
github_repo: https://github.com/WCY-dt/tangerine
# OPTIONAL settings: delete the following line if you don't need
# https://giscus.app/
giscus:
  data-repo: WCY-dt/tangerine
  data-repo-id: R_kgDOMcELBQ
  data-category-id: DIC_kwDOMcELBc4ChP42
# google_analytics: G-XXXXXXXXXX
# umami: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
# baidu_site_verification: codeva-xxxxxxxxxx

# translation settings
# If you have blog in another language, you can set the link here.
# translation:
#   lang: zh-CN
#   link: https://blog.ch3nyang.top

############# Theme Settings #############
# color theme: light or dark
color_theme: light # light or dark

# icons are from https://fonts.google.com/icons. If you want to modify it,
# you may need to replace assets/font/Material_Symbols_Outlined.woff2 with
# assets/font/Material_Symbols_Outlined.woff2.backup
# Modify this may cause unexpected errors from _includes/header.html
navy:
  - title: post
    url: /
    icon: web_stories
  - title: demo
    url: https://blog.ch3nyang.top
    icon: note_stack
  - title: github
    url: https://github.com/WCY-dt/tangerine
    icon: data_object
  # - title: about
  #   url: https://ch3nyang.top
  #   icon: assignment_ind
  # - title: category
  #   url: /category/
  #   icon: category
  - title: tag
    url: /tag/
    icon: local_offer
  - title: rss
    url: feed.xml
    icon: rss_feed

# icons are from https://fontawesome.com/icons. If you want to add other icons,
# you may need to search for "/assets/style/font-awesome.css" and replace it
# with https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css.
# You may also modify _includes/share.html
share:
  - hackernews
  - twitter
  - facebook
  - reddit
  - telegram
# - weibo

############# Other Settings #############
# Enable this when you need to modify the theme
dev_mode: false

# Please do not modify the following settings unless you know what you are doing.
permalink: /post/:title/
theme_config:
  date_format: "%Y-%m"
markdown: kramdown
highlighter: rouge # Supported language: https://github.com/rouge-ruby/rouge/wiki/List-of-supported-languages-and-lexers
kramdown:
  input: GFM
sass:
  style: compressed
jekyll-archives:
  enabled: [categories, tags, year]
  layout: archive
  permalinks:
    tag: /tag/:name/
    category: /category/:name/
    year: /year/:year/
plugins:
  - jekyll-archives
  - jekyll-loading-lazy
webrick:
  headers:
    Access-Control-Allow-Origin: "*"
exclude:
  - LICENSE.txt
  - README.md
  - README_zh-CN.md
